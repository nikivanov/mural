; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Build the MKS DLC32 variant with: pio run -e mks_dlc32
default_envs = fluidnc

; Settings shared by every board.
[env]
platform = espressif32@6.12.0
board = esp32dev
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_filters = esp32_exception_decoder
extra_scripts = build.py, merge_bin.py
framework = arduino

lib_deps = 
	https://github.com/tzapu/WiFiManager.git@2.0.17
	https://github.com/ESP32Async/ESPAsyncWebServer.git@^3.7.4
	https://github.com/madhephaestus/ESP32Servo.git@^3.0.9
	https://github.com/adafruit/Adafruit_SSD1306.git@^2.5.13
	waspinator/AccelStepper@^1.64
	bblanchon/ArduinoJson@^5.13.4

; TMC2209 Pen/Laser FluidNC CNC Controller (on-board TMC2209s configured over UART)
[env:fluidnc]
build_flags = -DMURAL_BOARD_FLUIDNC
lib_deps = 
	${env.lib_deps}
	https://github.com/teemuatlut/tmcstepper.git@0.7.3+sha.74e8e68

; MKS DLC32 v2.1 (socketed standalone TMC2209 drivers, STEP/DIR/EN via 74HC595)
[env:mks_dlc32]
build_flags = -DMURAL_BOARD_MKS_DLC32
