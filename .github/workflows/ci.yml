name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    name: Firmware build + flash-budget gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Install littlefs-python (for flash-budget gate)
        run: pip install littlefs-python

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Build firmware
        run: pio run

      - name: Build filesystem image
        run: pio run -t buildfs

      - name: Check flash-size budgets
        run: python tools/check_sizes.py

  pipeline:
    name: TS pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tsc
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        # Full install (not --ignore-scripts): "canvas" ships prebuilt Linux
        # x64 binaries fetched by its install script, and the full-pipeline
        # regression tests self-skip when require("paper") can't load canvas.
        # With --ignore-scripts those tests would silently skip forever.
        # Fall back to --ignore-scripts here only if the prebuilt fetch proves
        # flaky on the runner; for local/macOS dev, --ignore-scripts is fine.
        run: npm install

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: |
          if grep -q "no test specified" package.json; then
            echo "Skipping: test script is still the unimplemented stub."
          else
            npm test --if-present
          fi
